plugins { id 'com.android.application' }

android {
    namespace 'org.gptdictation.assistant'
    compileSdk 35
    buildToolsVersion '35.0.0'
    defaultConfig {
        applicationId 'org.gptdictation.assistant'
        minSdk 26
        targetSdk 35
        versionCode 24
        versionName '0.9.4'
    }
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
